[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-full"
version = "8.0.0"
description = "Tier-1 Web Application DAST Scanner — 28 detectors, OOB blind detection, WAF bypass, compliance reporting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["playwright>=1.40.0,<2.0.0", "pyyaml>=6.0,<7.0", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "black>=24.0", "ruff>=0.1", "mypy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require the test server running",
]
